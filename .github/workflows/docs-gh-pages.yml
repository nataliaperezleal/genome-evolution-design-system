name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build:tokens
      - run: npm run build:docs
        env:
          BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
      - name: Publicar CSS del design system para AI Design OS
        run: |
          mkdir -p apps/docs/dist/ds
          cp packages/tokens/dist/variables.css apps/docs/dist/ds/variables.css
          cp packages/tokens/dist/color-role-contexts.json apps/docs/dist/ds/color-role-contexts.json
          cp packages/react/src/styles.css apps/docs/dist/ds/styles.css
          echo "$GITHUB_SHA" > apps/docs/dist/ds/VERSION
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
